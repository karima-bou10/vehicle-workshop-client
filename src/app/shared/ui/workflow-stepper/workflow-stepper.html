@if (annulee()) {
  <p class="stepper-annulee">Intervention annulée — le workflow est interrompu.</p>
} @else {
  <ol class="stepper">
    @for (etape of etapes(); track etape.statut) {
      <li class="stepper__etape" [class]="'stepper__etape--' + etape.etat">
        <span class="stepper__marqueur">
          @if (etape.etat === 'faite') {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"
                 aria-hidden="true">
              <path d="M3.5 8.5l3 3 6-7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            {{ etape.rang }}
          }
        </span>
        <span class="stepper__label">{{ etape.label }}</span>
      </li>
    }
  </ol>
}

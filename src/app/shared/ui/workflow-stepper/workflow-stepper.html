<ul class="workflow-stepper__steps">
  @for (step of steps; track step.key) {
    <li [class]="stepClass(step)">
      <div class="workflow-stepper__bullet"></div>
      <div>
        <strong>{{ step.label }}</strong>
        @if (step.description) {
          <p class="workflow-stepper__description">{{ step.description }}</p>
        }
      </div>
    </li>
  }
</ul>

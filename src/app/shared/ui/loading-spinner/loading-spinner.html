<div class="loader" [class.loader--full]="pleinePage()" role="status" aria-live="polite">
  <span class="loader__ring" [class]="'loader__ring--' + taille()"></span>
  @if (message()) {
    <span class="loader__message">{{ message() }}</span>
  }
  <span class="loader__sr">Chargement en cours</span>
</div>
